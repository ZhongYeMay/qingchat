<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Chat · 注册邀请</title><meta name="description" content="通过注册邀请创建 Chat 账号，使用即时通信与内容分享功能。"><meta property="og:title" content="Chat 注册邀请"><meta property="og:description" content="访问邀请页并完成 Chat 账号注册。"><meta property="og:image" content="https://zhongyemay.github.io/qingchat/assets/icon-512.png"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="assets/icon.svg"><link rel="stylesheet" href="style.css?v=3a8d0df2cfc1"><script type="module" src="invite.js?v=2197f7bce99b"></script></head><body class="invite-document"><header class="share-brand"><a href="./">Chat<span>账号注册与邀请</span></a><a href="./" class="button-link">打开 Chat</a></header><p id="invite-loading" class="invite-status" role="status">正在加载邀请…</p><section id="invite-failure" class="public-share-card" hidden><h1>邀请不可用</h1><p id="invite-error" role="alert"></p><a href="./" class="button-link">前往 Chat</a></section><main id="invite-layout" class="invite-layout" hidden><section id="invite-hero-slot"></section><section class="invite-join-panel"><div id="invite-already" hidden><h2>账号已登录</h2><p>当前账号已登录，可直接访问 Chat。</p><a href="./" class="button-link invite-preview-cta">进入 Chat</a></div><form id="invite-register"><div class="eyebrow">JOIN CHAT</div><h2>创建账号</h2><label>昵称<input id="invite-nickname" maxlength="24" autocomplete="nickname" required placeholder="请输入昵称"></label><label>邮箱<input id="invite-email" type="email" autocomplete="email" required placeholder="请输入邮箱地址"></label><label>密码<input id="invite-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="至少 8 位密码"></label><p id="invite-register-error" class="form-message" role="alert"></p><md-filled-button id="invite-submit" class="invite-submit" type="submit">注册 Chat 账号</md-filled-button><p class="modal-note">现有账号登录：<a href="./">登录 Chat</a></p><p class="modal-note">注册后可使用好友管理、即时通信及动态发布功能。</p></form><div id="invite-success" hidden><h2>注册结果</h2><p id="invite-success-note"></p><a href="./" class="button-link invite-preview-cta">进入 Chat</a></div><p id="invite-expiry" class="modal-note"></p></section></main><noscript>请启用 JavaScript 后查看邀请和注册。</noscript></body></html>
