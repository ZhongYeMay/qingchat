<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青聊 · 让联系更简单</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><nav class="rail"><div class="logo">◒</div><button class="nav active" data-tab="chats" title="聊天" aria-label="聊天">☏</button><button class="nav" data-tab="contacts" title="通讯录" aria-label="通讯录">♧</button><div class="rail-bottom"><button id="about" title="关于青聊">ⓘ</button><div class="avatar me">我</div></div></nav><aside class="sidebar"><header><div class="brand"><h1>青聊<span>QINGCHAT</span></h1><button id="add" class="add" title="添加联系人">＋</button></div><label class="search"><span>⌕</span><input id="search" placeholder="搜索联系人或聊天" autocomplete="off"></label></header><div class="list-label"><span id="list-title">消息</span><span id="count"></span></div><div id="conversations"></div><footer><i></i> 本地体验版 · 聊天记录保存在此浏览器</footer></aside><section class="chat"><header class="chat-header"><button class="back" id="back" aria-label="返回会话">‹</button><div><h2 id="chat-name"></h2><p id="chat-sub"></p></div><button id="details" title="联系人资料">•••</button></header><div class="demo-banner">✦ 欢迎体验青聊，当前联系人和历史消息为演示数据。</div><div id="messages" class="messages" aria-live="polite"></div><section class="composer"><div class="toolbar"><button id="emoji" title="插入表情">☺</button><button id="image" title="发送图片">▧</button><input type="file" id="file" accept="image/*" hidden><span>把日常，分享给在意的人</span></div><textarea id="draft" aria-label="消息内容" placeholder="发送消息…"></textarea><div class="send-row"><span>Enter 发送 · Shift + Enter 换行</span><button id="send">发送 <span>↗</span></button></div></section></section><aside class="profile"><div class="profile-art"><span>保持联系<br>让美好发生。</span><div class="art-circle"></div></div><div id="profile"></div><div class="note"><span>今日小记</span><p>有些话不必等到见面。<br>现在就和朋友打个招呼吧。</p><small>MAKE A LITTLE CONNECTION</small></div></aside></main><div id="toast" role="status"></div><dialog id="dialog"><form method="dialog"><button class="close">×</button><h2>添加联系人</h2><p>创建一个本地联系人，开始记录对话。</p><label>昵称<input id="new-name" maxlength="20" placeholder="输入昵称" required></label><button id="create" type="button">添加联系人</button></form></dialog><script src="app.js"></script></body></html>
