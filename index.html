<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ededed"><meta name="description" content="青聊，与你在意的人保持联系。支持好友申请、实时聊天与多设备同步。"><title>青聊 · 保持联系</title><link rel="stylesheet" href="style.css?v=2"><script type="module" src="app.js?v=2"></script></head>
<body>
<section id="auth-screen" class="auth-screen"><div class="auth-brand"><div class="brand-mark" data-icon="chat"></div><span>青聊</span><small>QINGCHAT</small></div><main class="auth-card"><div class="auth-logo" data-icon="chat"></div><h1 id="auth-title">登录青聊</h1><p class="muted" id="auth-subtitle">与你在意的人，保持联系。</p><div class="auth-tabs"><button id="login-tab" class="active">登录</button><button id="signup-tab">注册</button></div><form id="auth-form"><label id="nickname-field" hidden>昵称<input id="auth-nickname" maxlength="24" autocomplete="nickname" placeholder="朋友怎么称呼你"></label><label>邮箱<input id="auth-email" type="email" autocomplete="email" required placeholder="请输入邮箱"></label><label>密码<input id="auth-password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required placeholder="至少 8 位密码"></label><p id="auth-error" class="form-message" role="alert"></p><button id="auth-submit" class="primary wide" type="submit">登录</button></form><button id="forgot" class="text-button" hidden>忘记密码？</button><p class="auth-note">好友 · 即时消息 · 多设备同步</p></main><p class="auth-footer">青聊 QINGCHAT <span>让每一次联系，都近一点。</span></p></section>
<main class="app" id="app" hidden><nav class="rail" aria-label="主导航"><button id="my-profile" class="avatar me" title="我的资料">我</button><button class="nav active" data-tab="chats" aria-label="聊天" title="聊天"><span data-icon="chat"></span><b id="total-unread" class="badge" hidden></b></button><button class="nav" data-tab="contacts" aria-label="通讯录" title="通讯录"><span data-icon="contacts"></span><b id="request-dot" class="dot" hidden></b></button><div class="rail-bottom"><button id="sync" title="立即同步" aria-label="立即同步"><span data-icon="refresh"></span></button><button id="logout" title="退出登录" aria-label="退出登录"><span data-icon="logout"></span></button></div></nav><aside class="sidebar"><header class="sidebar-header"><div class="sidebar-title"><h1>青聊</h1><span id="connection" class="connection">连接中</span></div><div class="search-row"><label class="search"><span data-icon="search"></span><input id="search" placeholder="搜索" autocomplete="off" aria-label="搜索会话与联系人"></label><button id="add-friend" class="square" title="添加朋友" aria-label="添加朋友"><span data-icon="plus"></span></button></div></header><button id="requests-button" class="requests-button" hidden><span class="avatar orange" data-icon="friend"></span><span>新的朋友</span><b id="request-count" class="badge" hidden></b></button><div id="conversations" class="conversation-list"></div><footer class="sidebar-footer"><span data-icon="lock"></span>消息仅对聊天双方可见</footer></aside><section class="chat"><div id="welcome" class="welcome"><div class="welcome-logo" data-icon="chat"></div><h2>青聊</h2><p>从一句问候，开始今天的对话。</p><button id="welcome-add" class="primary">添加朋友</button><small id="my-handle"></small></div><div id="chat-content" class="chat-content" hidden><header class="chat-header"><button id="back" class="back icon-button" aria-label="返回"><span data-icon="back"></span></button><div><h2 id="chat-name"></h2><p id="chat-subtitle">消息已同步</p></div><button id="chat-details" class="icon-button" title="朋友资料"><span data-icon="more"></span></button></header><div id="history-status" class="history-status" hidden></div><div id="messages" class="messages" aria-label="聊天消息" aria-live="polite"></div><div class="composer"><div class="toolbar"><button id="emoji" class="icon-button" title="表情"><span data-icon="smile"></span></button><button id="image-button" class="icon-button" title="发送图片"><span data-icon="image"></span></button><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><span id="composer-hint">消息会自动同步到其他设备</span></div><div id="emoji-picker" class="emoji-picker" hidden></div><textarea id="draft" aria-label="消息内容" placeholder="输入消息…" maxlength="4000"></textarea><div class="send-row"><span id="send-status">Enter 发送，Shift + Enter 换行</span><button id="send" class="send-button">发送(S)</button></div></div></div></section></main>
<dialog id="modal"><div class="modal-header"><h2 id="modal-title"></h2><button id="modal-close" class="icon-button" aria-label="关闭"><span data-icon="close"></span></button></div><div id="modal-body"></div></dialog><div id="toast" role="status"></div><noscript>请启用 JavaScript 后使用青聊。</noscript>
</body></html>
